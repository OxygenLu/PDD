<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="120"
     viewBox="0 0 1000 120"
     role="img"
     aria-label="Manifold-Prior Diverse Distillation for Medical Anomaly Detection">

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #1f2328;
      text-anchor: middle;
    }

    .pink {
      fill: #FF80AB;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #f0f6fc;
      }

      .pink {
        fill: #FF80AB;
      }
    }
  </style>

  <text class="title" x="500" y="43">
    Manifold-<tspan class="pink">P</tspan>rior
    <tspan class="pink">D</tspan>iverse
    <tspan class="pink">D</tspan>istillation for
  </text>

  <text class="title" x="500" y="96">
    Medical Anomaly Detection
  </text>
</svg>